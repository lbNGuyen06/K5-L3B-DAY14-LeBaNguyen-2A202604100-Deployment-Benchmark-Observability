name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2 (deterministic mock)
        env:
          AGENT_VERSION: v2
          PORT: "8000"
          MOCK_ERROR_RATE: "0"
        run: |
          nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "agent is up"
              exit 0
            fi
            sleep 1
          done
          echo "agent did not start"; cat agent.log; exit 1

      - name: Run eval (fail if accuracy < 85%)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out reports/eval_ci.json

      - name: Stop agent
        if: always()
        run: pkill -f "python app.py" || true

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
          if-no-files-found: ignore
